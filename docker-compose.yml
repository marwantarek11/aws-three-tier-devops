# Local development stack. Credentials here are throwaway local values only;
# in AWS the DB password is generated by RDS and injected from Secrets Manager.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

  api:
    build:
      context: ./app/backend
    environment:
      DB_HOST: db
      DB_NAME: app
      DB_USER: app
      DB_PASSWORD: local-dev-only
      DB_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  web:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-8088}:8080"
    volumes:
      - ./app/frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./app/frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]

volumes:
  db-data:
